[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-complaint-classification"
version = "0.1.0"
description = "Recurrent and transformer models for consumer complaint classification"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "tensorflow>=2.16,<2.18",
    "torch>=2.2,<3",
    "transformers>=4.40,<5",
    "msvc-runtime>=14.40; platform_system == 'Windows' and python_version >= '3.11'",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
